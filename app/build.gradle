plugins {
    id 'com.android.application'
}

android {
    namespace 'com.baliscamcheck.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.baliscamcheck.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
